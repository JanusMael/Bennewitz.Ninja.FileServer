name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A version no other build produces, so the sample below can only restore the package this
      # run packs: nuget.org never has it. Set before the build, which stamps it, and read by every
      # later step. The run and attempt numbers are letter-prefixed because a digits-only
      # prerelease identifier with a leading zero fails restore (publish/AGENTS.md).
      - name: Choose the CI package version
        run: echo "PublicVersion=$(date -u +%Y.%-m.%-d)-ci.r${{ github.run_number }}.a${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --solution Bennewitz.Ninja.FileServer.sln -c Release --no-build

      # Packing is where the project graph is validated as NuGet sees it — a build alone would
      # not have caught the id collision between the library's PackageId and the executable's
      # AssemblyName. Output goes to the feed the sample already points at.
      - name: Pack
        run: dotnet pack src/Bennewitz.Ninja.FileServer -c Release --no-build -o publish/local-feed

      # The sample takes a PackageReference, so building it restores the package that was just
      # produced and compiles against what it actually ships — not against a project reference
      # that would resolve types the package might omit. Without the version it would restore the
      # published release from nuget.org instead, and prove nothing about this commit.
      - name: Build the sample against the package
        run: dotnet build samples/SampleWebApp -c Release -p:FileServerVersion="$PublicVersion"

      # Boot failures do not show up in a build: a missing view, an unregistered service, or a
      # port that cannot bind all compile perfectly well.
      - name: Smoke-test the published binary
        run: pwsh publish/Smoke-Test.ps1

  # ⭐ The release's pack and its packed-vs-declared check, on every push. At release time a
  # packaging mistake surfaces with the tag already pushed and the version already spent; here
  # it is free. PackagingTests in `build` checks the project files; this checks the output.
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack Bennewitz.Ninja.FileServer.sln -c Release --nologo --output ./packages/Release

      - name: Assert packed matches declared
        run: dotnet run --file scripts/assert-packages.cs -- ./packages/Release

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The image is a shipped artifact and breaks in ways the .NET build cannot see: a base
      # image that drops a tool the Dockerfile calls, or an entry point naming an assembly that
      # is not an executable. Both have happened here.
      - name: Build the container image
        run: docker build -f docker/Dockerfile -t fileserver:ci .

      - name: Run it and check it serves
        run: |
          mkdir -p /tmp/ci-files
          echo '# hello' > /tmp/ci-files/readme.md
          docker run -d --name fileserver-ci \
            -e FILE_SERVER_ROOT=/data \
            -v /tmp/ci-files:/data:ro \
            -p 5550:5550 fileserver:ci

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5550/files; then break; fi
            sleep 1
          done

          curl -sf -o /dev/null -w 'listing %{http_code}\n' http://localhost:5550/files
          curl -sf -o /dev/null -w 'markdown %{http_code}\n' http://localhost:5550/files/readme.md
          test "$(docker exec fileserver-ci id -u)" = "1654"

          # The image redistributes a vendored MIT stylesheet, whose notice must travel with it.
          # Asserted here because .dockerignore excludes the sibling LICENSE and README, so it is
          # one edit away from being excluded too, and nothing else would notice.
          docker exec fileserver-ci test -f /app/THIRD-PARTY-NOTICES.md

          docker rm -f fileserver-ci

  # The family conventions: documentation at the root and in every top-level directory, the
  # description, topics, feature toggles and rulesets. See docs/repository-conventions.md in
  # Bennewitz.Ninja.Templates.
  #
  # ⚠ The job name is a required check in .github/repository.json. Renaming it means changing that
  # list and running `repo-conventions apply` in the same change, or every pull request blocks.
  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the repository conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check
