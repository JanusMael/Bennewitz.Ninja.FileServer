name: Release

# ⛔ A PUBLISHED NUGET VERSION CAN NEVER BE REPLACED. Everything else here is recoverable; the
# push is not. So the packed-vs-declared check runs before it, the package is named from
# packages.push rather than globbed, and --skip-duplicate makes a re-run of a completed release a
# no-op rather than a failure.

on:
  push:
    tags: ['v*']
  # Credential preflight. Running this by hand logs in to NuGet.org and stops, which proves the
  # trusted-publishing policy, the id-token permission, and the NUGET_USER variable all line up —
  # without cutting a release. It has to live in this workflow rather than a test one of its own:
  # the OIDC token is bound to the workflow file, so a different filename would never match the
  # policy. Every publishing step below is gated on a tag push, so a manual run cannot publish.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Mints the short-lived OIDC token that NuGet/login exchanges for a publish token.
      # Without it the login step fails with 403.
      id-token: write
      # The job also creates the GitHub Release, which needs write. Declaring permissions at
      # all drops everything not listed, so this cannot be narrowed to read.
      contents: write

    env:
      # Trusted publishing carries no secret to leak — this is only the nuget.org profile name
      # the OIDC token is exchanged against. A repository variable rather than a secret: it is
      # not a credential, and a masked value would turn a failed login into "owned by user
      # '***'", hiding the one value that explains it. A tag with it unset is refused below.
      NUGET_USER: ${{ vars.NUGET_USER }}
      # A tag push is a real release; anything else is the preflight.
      RELEASING: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The version comes from the TAG, so the tag and the package agree by construction.
      - name: Extract version from tag
        id: version
        if: env.RELEASING == 'true'
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        shell: bash

      # ⛔ Fail LOUDLY rather than publish nothing quietly. Without this, a tag with the variable
      # unset skips the push (which is gated on NUGET_USER) but still creates the GitHub Release
      # below — a green run, a release page, and no package. That false green is worse than a
      # failure, because the next person reads the release as evidence the package shipped.
      - name: Refuse to release without NUGET_USER
        if: env.RELEASING == 'true' && env.NUGET_USER == ''
        run: |
          echo "::error::NUGET_USER is not set. Refusing to release: the push would be skipped"
          echo "::error::and a GitHub Release would be created for a package that never shipped."
          exit 1

      # ⛔ Nothing publishes from a repository missing what the family conventions prescribe: its
      # documents, a replaced marker, a description. Runs in the preflight too, so a dispatch with
      # the version blank reports it before a tag does. A setting that has merely drifted does not
      # stop a release; CI's `conventions` job reports that.
      - name: Refuse to release a repository the conventions reject
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check --release

      - name: Publish all RIDs
        if: env.RELEASING == 'true'
        run: pwsh publish/publish.ps1 -All
        env:
          PublicVersion: ${{ steps.version.outputs.version }}

      # The whole solution, not one project: a packable project added later then shows up in the
      # packed output, where the next step refuses it until it is classified.
      - name: Pack
        if: env.RELEASING == 'true'
        run: dotnet pack Bennewitz.Ninja.FileServer.sln -c Release -o nupkg
        env:
          PublicVersion: ${{ steps.version.outputs.version }}

      # ⛔ The last gate before anything becomes permanent. PackagingTests already checked the
      # project files; this checks what pack ACTUALLY produced, reading each id from the <id>
      # element inside the .nuspec rather than parsing filenames. A package that appears here and
      # in neither list stops the run.
      - name: Assert packed matches declared
        if: env.RELEASING == 'true'
        run: dotnet run --file scripts/assert-packages.cs -- ./nupkg

      # Kept immediately before the push: the token this returns is short-lived, and a slow step
      # in between is how it expires before it is used.
      - name: Log in to NuGet.org (OIDC)
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # ⚠ A successful login proves a policy matched — NEVER that it covers every id. The exchange
      # succeeds before any package id is considered, so the summary lists what a tag would push
      # from packages.push, for comparing against the policy's glob patterns on nuget.org.
      - name: Report the preflight result
        if: env.RELEASING != 'true'
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not set, so a tag would be refused."
            exit 1
          fi
          echo "Logged in to NuGet.org as '$NUGET_USER'. Tagging will publish."
          {
            echo "### Trusted publishing verified"
            echo "Logged in as \`$NUGET_USER\`. A \`v*\` tag will publish:"
            echo ""
            grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$' | sed 's/^/- `/; s/$/`/'
            echo ""
            echo "Confirm ONE policy on nuget.org whose Glob Patterns cover every id above, and"
            echo "NOT a policy per id: one exchange mints one key scoped to one policy, so a second"
            echo "policy is never consulted and its package is rejected 403 — after the first is"
            echo "already permanent."
            if grep -qE '^[[:space:]]*[^#[:space:]]' packages.local 2>/dev/null; then
              echo ""
              echo "⛔ That pattern must NOT match anything in packages.local:"
              grep -v '^[[:space:]]*#' packages.local | grep -v '^[[:space:]]*$' | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ NAMED, NEVER GLOBBED — and driven by packages.push rather than a list repeated here, so
      # the declaration has exactly one home. A glob publishes whatever happens to be in the
      # folder, and a published version is permanent.
      - name: Push the package to NuGet.org
        if: env.RELEASING == 'true' && env.NUGET_USER != ''
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r id; do
            targets+=("./nupkg/${id}.${VERSION}.nupkg")
          done < <(grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$')
          printf 'Pushing %s\n' "${targets[@]}"
          dotnet nuget push "${targets[@]}" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Same list for the packages, and one archive per runtime identifier, each named: a missing
      # one fails here rather than shipping a release without that platform, and nothing unnamed
      # is attached. The archive names carry no version, so releases/latest/download links keep
      # working across releases.
      - name: Create GitHub Release
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r id; do
            assets+=("./nupkg/${id}.${VERSION}.nupkg")
          done < <(grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$')
          for rid in win-x64 win-arm64; do
            assets+=("publish/dist/Bennewitz.Ninja.FileServer-${rid}.zip")
          done
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            assets+=("publish/dist/Bennewitz.Ninja.FileServer-${rid}.tar.gz")
          done
          ls -l "${assets[@]}"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes "${assets[@]}"
